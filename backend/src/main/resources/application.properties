# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/secure_banking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sammu1020
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production
jwt.expiration=86400000

# Security Configuration
security.otp.expiration=300000
security.max-login-attempts=3
security.lock-time-minutes=15

# Transaction Monitoring Configuration
transaction.monitoring.large-amount-threshold=50000
transaction.monitoring.max-transactions-per-minute=5
transaction.monitoring.suspicious-time-window=60000